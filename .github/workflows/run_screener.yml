# Save this file in your repo at: .github/workflows/run_screener.yml
name: Run Strategy Alpha Screener

on:
  schedule:
    # Cron times are in UTC. 13:00 UTC Mon-Fri = 5:00 AM PST (6:00 AM during daylight saving time, Mar-Nov).
    - cron: "0 13 * * 1-5"
  workflow_dispatch:        # adds a "Run workflow" button for manual runs

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run data pipeline
        run: python data_pipeline.py

      - name: Run screener (save its printed results)
        shell: bash
        run: python strategy_alpha.py | tee screener_output.txt

      - name: Run database check (save its printed results)
        shell: bash
        run: python view_data.py | tee view_data_output.txt

      - name: Build email body
        shell: bash
        run: |
          python - <<'EOF'
          import html
          sections = [
              ("Screener signals", "screener_output.txt"),
              ("Database check (view_data.py)", "view_data_output.txt"),
          ]
          parts = []
          for title, path in sections:
              with open(path, encoding="utf-8") as f:
                  text = html.escape(f.read())
              parts.append(
                  f"<h3 style='font-family:Arial,sans-serif'>{title}</h3>"
                  f"<pre style='font-family:Consolas,Menlo,monospace;font-size:12px;"
                  f"background:#f6f8fa;padding:12px;border-radius:6px;overflow-x:auto'>{text}</pre>"
              )
          with open("email_body.html", "w", encoding="utf-8") as f:
              f.write("".join(parts))
          EOF

      - name: Email results
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Strategy Alpha report"
          to: yangdan3210@gmail.com
          from: Strategy Alpha Bot <${{ secrets.MAIL_USERNAME }}>
          body: file://view_data_output.txt
          html_body: file://email_body.html

      - name: Keep a copy of the results in GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            screener_output.txt
            view_data_output.txt
            screener_dashboard.html
          if-no-files-found: ignore
          retention-days: 30
