# Save this file in your repo at: .github/workflows/run_screener.yml
name: Run Strategy Alpha Screener

on:
  schedule:
    # Cron times are in UTC. 13:00 UTC Mon-Fri = 5:00 AM PST (6:00 AM during daylight saving time, Mar-Nov).
    - cron: "0 13 * * 1-5"
  workflow_dispatch:        # adds a "Run workflow" button for manual runs

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run data pipeline
        run: python data_pipeline.py

      - name: Remove any old report
        run: rm -f screener_dashboard.html

      - name: Run screener
        run: python strategy_alpha.py

      - name: Check report was created
        run: |
          echo "Files in project folder:"
          ls -la
          if [ ! -f screener_dashboard.html ]; then
            echo "ERROR: screener_dashboard.html was not created by strategy_alpha.py"
            exit 1
          fi
          echo "Report found:"
          ls -la screener_dashboard.html
          grep -o 'generated [0-9-]* [0-9:]* UTC' screener_dashboard.html | head -n1

      - name: Set today's date
        run: echo "TODAY=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Email HTML report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Strategy Alpha report"
          to: yangdan3210@gmail.com
          from: Strategy Alpha Bot <${{ secrets.MAIL_USERNAME }}>
          body: "Attached is today's Strategy Alpha screener report. Download the attachment and open it in Chrome or Edge to see the table and charts."
          attachments: ${{ github.workspace }}/screener_dashboard.html

      - name: Keep a copy of the report in GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: screener_dashboard.html
          retention-days: 30
